[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bankcreditdsl"
version = "0.1.0"
description = "Bank Credit DSL — a textX-based language for defining credit products, workflows and eligibility rules"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

authors = [
    { name = "Sara" },
    { name = "Jelena" },
    { name = "Vesna" }
]

dependencies = [
    "textX>=4.0,<5",
    "click>=8.1,<9",
    "Jinja2>=3.0",
    "pdfkit>=1.0",
    "graphviz>=0.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
    "pytest-cov>=5.0",
]

[project.urls]
Homepage = "https://github.com/Mihajlovicka/credit_textX_dsl"

[project.scripts]
bankdsl = "bankdsl.cli:main"

[project.entry-points."textx_languages"]
bankdsl = "bankdsl.grammar:bank_credit_language"

[project.entry-points."textx_generators"]
decision_report = "bankdsl.generators.decision_report:decision_report_generator"

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools.package-data]
bankdsl = ["grammar/*.tx"]

[tool.pytest.ini_options]
testpaths = ["tests"]