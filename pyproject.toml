[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bankcreditdsl"
version = "0.1.0"
description = "Bank Credit DSL — a textX-based language for defining credit products, workflows and eligibility rules"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

authors = [
    { name = "Sara" },
    { name = "Jelena" },
    { name = "Vesna" }
]

dependencies = [
    "textX>=4.0,<5",
    "click>=8.1,<9",
    "Jinja2>=3.0",
    "xhtml2pdf>=0.2.18",
    "graphviz>=0.20",
    "pygls>=2.1.1"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
    "pytest-cov>=5.0",
]

[project.urls]
Homepage = "https://github.com/Mihajlovicka/credit_textX_dsl"

[project.scripts]
bank-credit = "bankdsl.cli:main"

[project.entry-points."textx_languages"]
bankdsl = "bankdsl.grammar:bank_credit_language"

[project.entry-points."textx_generators"]
decision_report = "bankdsl.generators.decision_report:decision_report_generator"
amortization = "bankdsl.generators.amortization_schedule:amortization_generator"

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools.package-data]
bankdsl = ["grammar/*.tx", "templates/*.j2", "css/*.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]